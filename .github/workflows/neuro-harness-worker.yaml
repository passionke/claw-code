# neuro-harness engine worker images on home-ubt → ACR (experimental branch). Author: kejiqing
#
#   claw-gateway-worker-opencode:<tag>   FROM claw-gateway-worker:<tag> + opencode + neuro-opencode
#   claw-gateway-worker-appserver:<tag>  FROM claw-gateway-worker:<tag> + node/codex-acp + neuro-appserver
#
# <tag> must already exist as the strict worker in ACR (claw-code-branch-worker / release flow)
# and come from the same commit as `branch`. e2b templates: deploy/e2b/bootstrap-templates-from-ci-tag.sh <tag>.
# Manual only (`workflow_dispatch`). Runner: [self-hosted, home-ubt]. Uses the ACR claw-rust-compile image.
name: neuro-harness-worker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Strict worker tag in ACR (e.g. branch-feat-neuro-harness)"
        required: true
      branch:
        description: "Branch to compile neuro-* from (empty = triggering ref)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CLAW_CONTAINER_RUNTIME: docker
  CLAW_USE_CN_CRATES_MIRROR: "1"
  CLAW_USE_CN_RUST_MIRROR: "1"
  CLAW_USE_CN_APT_MIRROR: "1"
  # home-ubt is in China: claw_npm_registry → registry.npmmirror.com
  region: china

jobs:
  build-and-push:
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}

      - name: Self-hosted workspace prep
        run: bash deploy/stack/lib/ci-self-hosted-workspace-prep.sh

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_REGISTRY}" ]; then
            echo "::error::ACR_REGISTRY is empty" >&2
            exit 1
          fi
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve images
        id: images
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source deploy/stack/rust-version.env
          {
            echo "container_base_registry=${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
            echo "compile_image=${PREFIX}/claw-rust-compile:${CLAW_RUST_IMAGE_TAG}"
            echo "strict_worker=${PREFIX}/claw-gateway-worker:${TAG}"
            echo "sha12=$(git rev-parse HEAD | head -c 12)"
          } >> "$GITHUB_OUTPUT"

      - name: Linux compile (neuro-opencode / neuro-appserver)
        env:
          CLAW_LINUX_COMPILE_CI: "1"
          CONTAINER_BASE_REGISTRY: ${{ steps.images.outputs.container_base_registry }}
          CLAW_RUST_COMPILE_IMAGE: ${{ steps.images.outputs.compile_image }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash deploy/stack/lib/linux-compile.sh

      - name: Build + smoke-check engine images
        env:
          CONTAINER_BASE_REGISTRY: ${{ steps.images.outputs.container_base_registry }}
          STRICT: ${{ steps.images.outputs.strict_worker }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          docker pull "${STRICT}"
          bash deploy/neuro-harness/build-worker-images.sh "${STRICT}" "${TAG}"

      - name: Push engine images → ACR (skopeo v2s2)
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          TAG: ${{ inputs.tag }}
          SHA12: ${{ steps.images.outputs.sha12 }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          for engine in opencode appserver; do
            ./deploy/stack/lib/ci-push-acr-skopeo.sh \
              "claw-gateway-worker-${engine}:${TAG}" \
              "${PREFIX}/claw-gateway-worker-${engine}:${TAG}" \
              "${PREFIX}/claw-gateway-worker-${engine}:dev-${SHA12}"
          done
          {
            echo "## neuro-harness worker images"
            echo ""
            echo "- \`${PREFIX}/claw-gateway-worker-opencode:${TAG}\`"
            echo "- \`${PREFIX}/claw-gateway-worker-appserver:${TAG}\`"
            echo ""
            echo "e2b: \`deploy/e2b/bootstrap-templates-from-ci-tag.sh ${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self-hosted workspace cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/deploy/stack/.linux-artifacts" 2>/dev/null || true
          chmod +x ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh
          ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh
