# home-ubt (10.8.0.21 / passionkeosxubt): compile + docker build + skopeo → ACR.
# No GHCR hop, no aliyun-hk / contabo-sg mirror. Author: kejiqing
#
# Chain (push tag refs/tags/release-v*):
#   rust-compile-image → linux-compile-once → build-and-push →
#   build-and-push-relaxed-worker
# ACR personal edition needs skopeo --format v2s2 (see deploy/stack/lib/ci-push-acr-skopeo.sh).
# Runner: [self-hosted, home-ubt] only.
#
# Optional repo Variables:
#   ACR_REGISTRY, ACR_GITHUB_ENVIRONMENT (default claw-acr / dockerhub)
#   CONTAINER_BASE_REGISTRY (hostname; home CN default docker.1ms.run when unset in job)
name: claw-code-image

on:
  push:
    tags:
      - "release-v*"

permissions:
  contents: read

env:
  CLAW_CONTAINER_RUNTIME: docker
  CLAW_USE_CN_CRATES_MIRROR: "1"
  CLAW_USE_CN_RUST_MIRROR: "1"
  CLAW_USE_CN_APT_MIRROR: "1"

jobs:
  rust-compile-image:
    name: publish claw-rust-compile (ACR)
    if: startsWith(github.ref, 'refs/tags/release-v')
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Show runner
        run: |
          echo "hostname=$(hostname)"
          echo "runner=${RUNNER_NAME:-}"

      # Before checkout: docker-written .ci-cache is root-owned; clean must chown first. Author: kejiqing
      - name: Self-hosted workspace prep
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          docker run --rm -v "${WS}:/w:rw" alpine:3.20 chown -R "${RUN_UID}:${RUN_GID}" /w
          rm -rf "${WS}/deploy/stack/.linux-artifacts" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_REGISTRY}" ]; then
            echo "::error::ACR_REGISTRY is empty" >&2
            exit 1
          fi
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          # shellcheck source=/dev/null
          source deploy/stack/rust-version.env
          echo "container_base_registry=${REG}" >> "$GITHUB_OUTPUT"
          echo "rust_image=${REG}/library/rust:${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "rust_image_tag=${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build claw-rust-compile (local)
        id: build
        run: |
          set -euo pipefail
          TAG="${{ steps.base_images.outputs.rust_image_tag }}"
          LOCAL="claw-rust-compile:${TAG}"
          docker build \
            -f ./deploy/stack/Containerfile.rust-compile \
            --build-arg "RUST_BASE_IMAGE=${{ steps.base_images.outputs.rust_image }}" \
            --build-arg "CLAW_USE_CN_APT_MIRROR=1" \
            -t "${LOCAL}" .
          echo "local=${LOCAL}" >> "$GITHUB_OUTPUT"

      - name: Push claw-rust-compile → ACR (skopeo v2s2)
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          TAG: ${{ steps.base_images.outputs.rust_image_tag }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          CF_HASH="$(sha256sum deploy/stack/Containerfile.rust-compile | awk '{print $1}' | head -c 12)"
          ./deploy/stack/lib/ci-push-acr-skopeo.sh \
            "claw-rust-compile:${TAG}" \
            "${PREFIX}/claw-rust-compile:${TAG}" \
            "${PREFIX}/claw-rust-compile:sha-${CF_HASH}"

  linux-compile-once:
    if: startsWith(github.ref, 'refs/tags/release-v')
    needs: rust-compile-image
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Self-hosted workspace prep
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          docker run --rm -v "${WS}:/w:rw" alpine:3.20 chown -R "${RUN_UID}:${RUN_GID}" /w
          rm -rf "${WS}/deploy/stack/.linux-artifacts" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          echo "container_base_registry=${REG}" >> "$GITHUB_OUTPUT"

      - name: Restore linux-compile cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
            .ci-cache/sccache
            .ci-cache/swagger-ui
          key: linux-compile-home-ubt-${{ hashFiles('rust/Cargo.lock', 'deploy/stack/Containerfile.rust-compile') }}
          restore-keys: |
            linux-compile-home-ubt-

      - name: Resolve rust compile image ref (ACR)
        id: compile_image
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source deploy/stack/rust-version.env
          echo "ref=${PREFIX}/claw-rust-compile:${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Linux compile (once)
        env:
          CLAW_LINUX_COMPILE_CI: "1"
          CONTAINER_BASE_REGISTRY: ${{ steps.base_images.outputs.container_base_registry }}
          CLAW_RUST_COMPILE_IMAGE: ${{ steps.compile_image.outputs.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash deploy/stack/lib/linux-compile.sh

      - name: Verify ci-cache ownership
        run: |
          set -euo pipefail
          if [ ! -d .ci-cache ]; then exit 0; fi
          RUN_UID="$(id -u)"
          BAD="$(find .ci-cache -not -user "${RUN_UID}" 2>/dev/null | head -5 || true)"
          if [ -n "${BAD}" ]; then
            echo "::error::.ci-cache non-runner-owned files" >&2
            exit 1
          fi

      - name: Stash linux artifacts locally (skip GitHub upload-artifact)
        run: |
          set -euo pipefail
          DEST="${HOME}/claw-ci-artifacts/${{ github.run_id }}"
          mkdir -p "${DEST}"
          cp -a deploy/stack/.linux-artifacts/release "${DEST}/"
          ls -lh "${DEST}/release" | head

      - name: Self-hosted workspace cleanup
        if: always()
        run: bash deploy/stack/lib/ci-self-hosted-workspace-cleanup.sh
        continue-on-error: true

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/release-v')
    needs: linux-compile-once
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: claw-code
            dockerfile: deploy/stack/Containerfile.gateway-rs.prebuilt
          - package: claw-gateway-worker
            dockerfile: deploy/stack/Containerfile.gateway-worker.prebuilt
          - package: claw-gateway-playground
            dockerfile: deploy/stack/Containerfile.gateway-playground
    steps:
      - name: Self-hosted workspace prep
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          RUN_UID="$(id -u)"
          docker run --rm -v "${WS}:/w:rw" alpine:3.20 chown -R "${RUN_UID}:$(id -g)" /w
          rm -rf "${WS}/deploy/stack/.linux-artifacts" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore linux artifacts from local stash
        if: matrix.package != 'claw-gateway-playground'
        run: |
          set -euo pipefail
          SRC="${HOME}/claw-ci-artifacts/${{ github.run_id }}/release"
          test -d "${SRC}"
          mkdir -p deploy/stack/.linux-artifacts
          cp -a "${SRC}" deploy/stack/.linux-artifacts/release

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          echo "debian_image=${REG}/library/debian:bookworm-slim" >> "$GITHUB_OUTPUT"
          echo "node_image=${REG}/library/node:20-alpine" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.package }} (local)
        id: build
        env:
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LOCAL="${PACKAGE}:${RELEASE_TAG}"
          docker build \
            -f "./${{ matrix.dockerfile }}" \
            --build-arg "DEBIAN_BASE_IMAGE=${{ steps.base_images.outputs.debian_image }}" \
            --build-arg "NODE_BASE_IMAGE=${{ steps.base_images.outputs.node_image }}" \
            -t "${LOCAL}" .
          echo "local=${LOCAL}" >> "$GITHUB_OUTPUT"

      - name: Push ${{ matrix.package }} → ACR (skopeo v2s2)
        env:
          PACKAGE: ${{ matrix.package }}
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          SHA12="${GITHUB_SHA:0:12}"
          ./deploy/stack/lib/ci-push-acr-skopeo.sh \
            "${PACKAGE}:${RELEASE_TAG}" \
            "${PREFIX}/${PACKAGE}:${RELEASE_TAG}" \
            "${PREFIX}/${PACKAGE}:sha-${SHA12}" \
            "${PREFIX}/${PACKAGE}:latest"

      - name: Verify playground admin assets
        if: matrix.package == 'claw-gateway-playground'
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMG="${PREFIX}/claw-gateway-playground:${RELEASE_TAG}"
          docker pull "${IMG}"
          docker run --rm "${IMG}" sh -c 'test -f /app/admin-dist/index.html && test -n "$(ls /app/admin-dist/assets/*.js 2>/dev/null)"'
          docker rmi "${IMG}" 2>/dev/null || true

      - name: Self-hosted workspace cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/deploy/stack/.linux-artifacts" 2>/dev/null || true

  build-and-push-relaxed-worker:
    if: startsWith(github.ref, 'refs/tags/release-v')
    needs: build-and-push
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Self-hosted workspace prep
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}"
          RUN_UID="$(id -u)"
          RUN_GID="$(id -g)"
          docker run --rm -v "${WS}:/w:rw" alpine:3.20 chown -R "${RUN_UID}:${RUN_GID}" /w

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build claw-gateway-worker-relaxed (local FROM ACR strict)
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          STRICT="${PREFIX}/claw-gateway-worker:${RELEASE_TAG}"
          LOCAL="claw-gateway-worker-relaxed:${RELEASE_TAG}"
          docker pull "${STRICT}"
          docker build \
            -f ./deploy/stack/Containerfile.gateway-worker-relaxed \
            --build-arg "WORKER_BASE_IMAGE=${STRICT}" \
            -t "${LOCAL}" .

      - name: Push relaxed worker → ACR (skopeo v2s2)
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          SHA12="${GITHUB_SHA:0:12}"
          ./deploy/stack/lib/ci-push-acr-skopeo.sh \
            "claw-gateway-worker-relaxed:${RELEASE_TAG}" \
            "${PREFIX}/claw-gateway-worker-relaxed:${RELEASE_TAG}" \
            "${PREFIX}/claw-gateway-worker-relaxed:sha-${SHA12}" \
            "${PREFIX}/claw-gateway-worker-relaxed:latest"

      - name: Verify relaxed worker tools
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMG="${PREFIX}/claw-gateway-worker-relaxed:${RELEASE_TAG}"
          docker pull "${IMG}"
          docker run --rm --entrypoint sh "${IMG}" -c 'command -v curl && command -v git && command -v python3'

      - name: Drop local artifact stash
        if: always()
        run: rm -rf "${HOME}/claw-ci-artifacts/${{ github.run_id }}" 2>/dev/null || true

      - name: home-ubt disk cleanup (keep .ci-cache)
        if: always()
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh
          ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh
