# Branch / dev worker images on home-ubt → ACR only (no GHCR). Author: kejiqing
#
# Tags (no `latest` — avoid clobbering release):
#   branch-<sanitized-branch>   e.g. branch-feat-delegate-output-yield
#   dev-<sha12>                 immutable commit pin
#
# Manual only (`workflow_dispatch`). Runner: [self-hosted, home-ubt].
name: claw-code-branch-worker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (empty = triggering ref)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CLAW_CONTAINER_RUNTIME: docker
  # Unified region switch: china → CN apt/cargo/rust mirrors; else → international. Author: kejiqing
  REGION: china

jobs:
  resolve-tag:
    name: resolve branch tag
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.tags.outputs.checkout_ref }}
      branch_tag: ${{ steps.tags.outputs.branch_tag }}
      dev_tag: ${{ steps.tags.outputs.dev_tag }}
      sha12: ${{ steps.tags.outputs.sha12 }}
    steps:
      - name: Checkout (resolve HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Compute branch / dev tags
        id: tags
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.branch }}" ]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          SANITIZED="$(printf '%s' "${BRANCH}" | tr '/_' '-' | sed 's/[^a-zA-Z0-9.-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')"
          SHA12="$(git rev-parse HEAD | head -c 12)"
          {
            echo "checkout_ref=${BRANCH}"
            echo "branch_tag=branch-${SANITIZED}"
            echo "dev_tag=dev-${SHA12}"
            echo "sha12=${SHA12}"
          } >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH} branch_tag=branch-${SANITIZED} dev_tag=dev-${SHA12}"

  rust-compile-image:
    name: publish claw-rust-compile (ACR)
    needs: resolve-tag
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Self-hosted workspace prep
        run: bash deploy/stack/lib/ci-self-hosted-workspace-prep.sh

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_REGISTRY}" ]; then
            echo "::error::ACR_REGISTRY is empty" >&2
            exit 1
          fi
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          # shellcheck source=/dev/null
          source deploy/stack/rust-version.env
          echo "rust_image=${REG}/library/rust:${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "rust_image_tag=${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build claw-rust-compile (local)
        run: |
          set -euo pipefail
          TAG="${{ steps.base_images.outputs.rust_image_tag }}"
          # shellcheck source=/dev/null
          source deploy/stack/lib/claw-region.sh
          claw_apply_region_defaults
          # GHA cannot pull nora.home; seed local sccache OCI then COPY --from. Author: kejiqing
          chmod +x deploy/stack/lib/seed-sccache-local.sh
          REGION="${REGION:-else}" bash deploy/stack/lib/seed-sccache-local.sh
          ./deploy/stack/lib/container-build.sh docker deploy/stack/Containerfile.rust-compile \
            --build-arg "RUST_BASE_IMAGE=${{ steps.base_images.outputs.rust_image }}" \
            --build-arg "CLAW_USE_CN_APT_MIRROR=${CLAW_USE_CN_APT_MIRROR:-0}" \
            --build-arg "SCCACHE_IMAGE=sccache:${SCCACHE_VERSION:-v0.10.0}" \
            -t "claw-rust-compile:${TAG}"

      - name: Push claw-rust-compile → ACR
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          TAG: ${{ steps.base_images.outputs.rust_image_tag }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          CF_HASH="$(sha256sum deploy/stack/Containerfile.rust-compile | awk '{print $1}' | head -c 12)"
          ./deploy/stack/lib/ci-push-acr-skopeo.sh \
            "claw-rust-compile:${TAG}" \
            "${PREFIX}/claw-rust-compile:${TAG}" \
            "${PREFIX}/claw-rust-compile:sha-${CF_HASH}"

  linux-compile-once:
    needs:
      - resolve-tag
      - rust-compile-image
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Self-hosted workspace prep
        run: bash deploy/stack/lib/ci-self-hosted-workspace-prep.sh

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          echo "container_base_registry=${REG}" >> "$GITHUB_OUTPUT"

      - name: Restore linux-compile cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo-registry
            .ci-cache/cargo-git
            .ci-cache/sccache
          key: linux-compile-home-ubt-${{ hashFiles('rust/Cargo.lock', 'deploy/stack/Containerfile.rust-compile') }}
          restore-keys: |
            linux-compile-home-ubt-

      - name: Resolve rust compile image ref (ACR)
        id: compile_image
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source deploy/stack/rust-version.env
          echo "ref=${PREFIX}/claw-rust-compile:${CLAW_RUST_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Linux compile (once)
        env:
          CLAW_LINUX_COMPILE_CI: "1"
          CONTAINER_BASE_REGISTRY: ${{ steps.base_images.outputs.container_base_registry }}
          CLAW_RUST_COMPILE_IMAGE: ${{ steps.compile_image.outputs.ref }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash deploy/stack/lib/linux-compile.sh

      - name: Stash linux artifacts locally
        run: |
          set -euo pipefail
          DEST="${HOME}/claw-ci-artifacts/${{ github.run_id }}"
          mkdir -p "${DEST}"
          cp -a deploy/stack/.linux-artifacts/release "${DEST}/"

      - name: Self-hosted workspace cleanup
        if: always()
        run: bash deploy/stack/lib/ci-self-hosted-workspace-cleanup.sh
        continue-on-error: true

  build-and-push:
    needs:
      - resolve-tag
      - linux-compile-once
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: claw-code
            dockerfile: deploy/stack/Containerfile.gateway-rs.prebuilt
          - package: claw-gateway-worker
            dockerfile: deploy/stack/Containerfile.gateway-worker.prebuilt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Self-hosted workspace prep
        run: bash deploy/stack/lib/ci-self-hosted-workspace-prep.sh

      - name: Restore linux artifacts from local stash
        run: |
          set -euo pipefail
          SRC="${HOME}/claw-ci-artifacts/${{ github.run_id }}/release"
          test -d "${SRC}"
          mkdir -p deploy/stack/.linux-artifacts
          cp -a "${SRC}" deploy/stack/.linux-artifacts/release

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve build base images
        id: base_images
        env:
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          REG="${CONTAINER_BASE_REGISTRY:-docker.1ms.run}"
          echo "debian_image=${REG}/library/debian:bookworm-slim" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.package }} (local)
        env:
          PACKAGE: ${{ matrix.package }}
          BRANCH_TAG: ${{ needs.resolve-tag.outputs.branch_tag }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source deploy/stack/lib/claw-region.sh
          claw_apply_region_defaults
          ./deploy/stack/lib/container-build.sh docker "${{ matrix.dockerfile }}" \
            --build-arg "DEBIAN_BASE_IMAGE=${{ steps.base_images.outputs.debian_image }}" \
            --build-arg "CLAW_USE_CN_APT_MIRROR=${CLAW_USE_CN_APT_MIRROR:-0}" \
            -t "${PACKAGE}:${BRANCH_TAG}"

      - name: Push ${{ matrix.package }} → ACR
        env:
          PACKAGE: ${{ matrix.package }}
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          BRANCH_TAG: ${{ needs.resolve-tag.outputs.branch_tag }}
          DEV_TAG: ${{ needs.resolve-tag.outputs.dev_tag }}
        run: |
          set -euo pipefail
          chmod +x ./deploy/stack/lib/ci-push-acr-skopeo.sh
          ./deploy/stack/lib/ci-push-acr-skopeo.sh \
            "${PACKAGE}:${BRANCH_TAG}" \
            "${PREFIX}/${PACKAGE}:${BRANCH_TAG}" \
            "${PREFIX}/${PACKAGE}:${DEV_TAG}"

      - name: Self-hosted workspace cleanup
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/deploy/stack/.linux-artifacts" 2>/dev/null || true

  # Images derived FROM the strict worker of the same tag, so one tag carries everything
  # deploy/e2b/bootstrap-templates-from-ci-tag.sh publishes. Author: kejiqing
  build-and-push-derived-workers:
    needs:
      - resolve-tag
      - build-and-push
    runs-on: [self-hosted, home-ubt]
    environment: ${{ vars.ACR_GITHUB_ENVIRONMENT || 'claw-acr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Self-hosted workspace prep
        run: bash deploy/stack/lib/ci-self-hosted-workspace-prep.sh

      - name: Restore linux artifacts from local stash
        run: |
          set -euo pipefail
          SRC="${HOME}/claw-ci-artifacts/${{ github.run_id }}/release"
          test -d "${SRC}"
          mkdir -p deploy/stack/.linux-artifacts
          cp -a "${SRC}" deploy/stack/.linux-artifacts/release

      - name: Verify ACR_REGISTRY
        id: reg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
        run: |
          set -euo pipefail
          echo "login_host=${ACR_REGISTRY%%/*}" >> "$GITHUB_OUTPUT"
          echo "image_prefix=${ACR_REGISTRY}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.login_host }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build relaxed + engine workers (FROM ACR strict)
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          BRANCH_TAG: ${{ needs.resolve-tag.outputs.branch_tag }}
          CONTAINER_BASE_REGISTRY: ${{ vars.CONTAINER_BASE_REGISTRY }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source deploy/stack/lib/claw-region.sh
          claw_apply_region_defaults
          export CLAW_IMAGE_PREFIX="${PREFIX}"
          export RELEASE_TAG="${BRANCH_TAG}"
          export CLAW_REGISTRY_USER="${{ secrets.ACR_USERNAME }}"
          export CLAW_REGISTRY_PASSWORD="${{ secrets.ACR_PASSWORD }}"
          export REGION="${REGION:-china}"
          chmod +x deploy/pack/publish.sh
          ./deploy/pack/publish.sh worker-base
          ./deploy/pack/publish.sh cli

      - name: Push derived workers → ACR
        env:
          PREFIX: ${{ steps.reg.outputs.image_prefix }}
          BRANCH_TAG: ${{ needs.resolve-tag.outputs.branch_tag }}
        run: |
          set -euo pipefail
          echo "worker-base + cli already pushed by publish.sh (tag=${BRANCH_TAG})"
          docker run --rm --entrypoint sh "${PREFIX}/claw-worker-base:${BRANCH_TAG}" -c '! command -v claw'

      - name: Drop local artifact stash
        if: always()
        run: rm -rf "${HOME}/claw-ci-artifacts/${{ github.run_id }}" 2>/dev/null || true

      - name: Self-hosted workspace cleanup
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}/deploy/stack/.linux-artifacts" 2>/dev/null || true
          chmod +x ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh
          ./deploy/stack/lib/ci-home-ubt-post-image-cleanup.sh

  summary:
    name: deploy hint
    needs:
      - resolve-tag
      - build-and-push
      - build-and-push-derived-workers
    runs-on: ubuntu-latest
    if: always() && needs.resolve-tag.result == 'success'
    steps:
      - name: Write summary
        run: |
          set -euo pipefail
          BT="${{ needs.resolve-tag.outputs.branch_tag }}"
          DT="${{ needs.resolve-tag.outputs.dev_tag }}"
          ACR="${{ vars.ACR_REGISTRY || 'crpi-cf9vxpq3n8or17mw.cn-hangzhou.personal.cr.aliyuncs.com/passionke' }}"
          {
            echo "## Branch worker image (home-ubt → ACR)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| branch tag | \`${BT}\` |"
            echo "| dev tag | \`${DT}\` |"
            echo "| ACR claw-code | \`${ACR}/claw-code:${BT}\` |"
            echo ""
            echo "### workPi"
            echo "\`\`\`bash"
            echo "cd ~/claw_code && git pull"
            echo "./deploy/stack/lib/workpi-branch-deploy.sh ${BT}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
