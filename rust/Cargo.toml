[workspace]
members = ["crates/*"]
# Own workspace: agent-client-protocol turns on serde_json preserve_order/raw_value, which
# would otherwise unify into claw/gateway builds and change their JSON behavior. Author: kejiqing
exclude = ["crates/neuro-harness"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

# Faster release builds (compile speed; keep opt-level=3, lto=false). Author: kejiqing
[profile.release]
codegen-units = 256
incremental = true
