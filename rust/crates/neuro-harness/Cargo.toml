[package]
name = "neuro-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ACP harness worker CLIs (neuro-opencode, neuro-appserver) speaking the gateway solve contract. Author: kejiqing"

[dependencies]
agent-client-protocol = { version = "=2.2.0", features = ["unstable_end_turn_token_usage"] }
gateway-solve-turn = { path = "../gateway-solve-turn" }
runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "neuro-opencode"
path = "src/bin/neuro-opencode.rs"

[[bin]]
name = "neuro-appserver"
path = "src/bin/neuro-appserver.rs"

[lints]
workspace = true
