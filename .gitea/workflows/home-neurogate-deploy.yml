# Author: kejiqing
# v* tag: this job starts Jenkins gateway+playground (GIT_TAG), waits, then up --release.
# Never compiles on 21. push main → home-neurogate-up (same pack-then-up, GIT_REF).
# No Gitea webhook. Newer v* cancels older deploy runs; group is separate from main-up.
name: home-neurogate-deploy

on:
  push:
    tags:
      - "v*"

concurrency:
  group: home-neurogate-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Register act_runner on neurogate host (10.8.0.21) with label neurogate.
    runs-on: neurogate
    timeout-minutes: 180
    steps:
      - name: Validate tag, Jenkins pack, then deploy
        shell: bash
        env:
          CLAW_DEPLOY_ROOT: /home/passionke/work/claw-code
          CLAW_IMAGE_PREFIX: nora.home.passionke.top/passionke
          JENKINS_ENV_FILE: /home/passionke/.secrets/jenkins.env
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip: not a strict vX.Y.Z tag (${TAG})"
            exit 0
          fi
          ROOT="${CLAW_DEPLOY_ROOT}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          # Home tags live on gitea only; origin is GitHub (release-v*) — do not prefer origin.
          if git remote get-url gitea >/dev/null 2>&1; then
            git fetch --tags --force gitea
          else
            git fetch --tags --force origin
          fi
          git checkout -f "tags/${TAG}" 2>/dev/null || git checkout -f "${TAG}"
          chmod +x deploy/stack/lib/home-neurogate-pack-via-jenkins.sh \
            deploy/stack/lib/home-neurogate-deploy-from-tag.sh
          bash deploy/stack/lib/home-neurogate-pack-via-jenkins.sh "GIT_TAG=${TAG}"
          bash deploy/stack/lib/home-neurogate-deploy-from-tag.sh "${TAG}"
