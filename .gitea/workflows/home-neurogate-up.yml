# Author: kejiqing
# Fast path: push/merge to main → 21 waits for Nora :latest (per-image) then up --release.
# Heavy pack stays on Jenkins (claw-code-gateway-nora / claw-code-playground-nora).
# Formal releases stay on v* + home-neurogate-deploy. Do NOT build/push images here.
name: home-neurogate-up

on:
  push:
    branches:
      - main

concurrency:
  group: home-neurogate-up
  cancel-in-progress: true

jobs:
  up:
    runs-on: neurogate
    steps:
      - name: Wait Nora latest images and up --release
        shell: bash
        env:
          CLAW_DEPLOY_ROOT: /home/passionke/work/claw-code
          CLAW_IMAGE_PREFIX: nora.home.passionke.top/passionke
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FULL_SHA="${FULL_SHA:?}"
          ROOT="${CLAW_DEPLOY_ROOT}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          if git remote get-url gitea >/dev/null 2>&1; then
            git fetch --force gitea
          else
            git fetch --force origin
          fi
          git checkout -f "${FULL_SHA}"
          git log -1 --oneline
          test -f deploy/stack/lib/home-neurogate-deploy-from-tag.sh
          chmod +x deploy/stack/lib/home-neurogate-deploy-from-tag.sh
          export CLAW_NORA_IMAGE_WAIT_SECS="${CLAW_NORA_IMAGE_WAIT_SECS:-3600}"
          export CLAW_NORA_IMAGE_POLL_SECS="${CLAW_NORA_IMAGE_POLL_SECS:-30}"
          echo "==> branch fast-up commit=${FULL_SHA} image_tag=latest"
          bash deploy/stack/lib/home-neurogate-deploy-from-tag.sh latest
