# Author: kejiqing
# Fast path: push/merge to main → 21 only waits for Nora sha-* then up --release.
# Heavy pack stays on Jenkins (claw-code-nora with GIT_REF=<commit>).
# Formal releases stay on v* + home-neurogate-deploy. Do NOT build/push images here.
name: home-neurogate-up

on:
  push:
    branches:
      - main

jobs:
  up:
    runs-on: neurogate
    steps:
      - name: Wait Nora sha image and up --release
        shell: bash
        env:
          CLAW_DEPLOY_ROOT: /home/passionke/work/claw-code
          CLAW_IMAGE_PREFIX: nora.home.passionke.top/passionke
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FULL_SHA="${FULL_SHA:?}"
          SHA12="$(printf '%s' "$FULL_SHA" | cut -c1-12)"
          TAG="sha-${SHA12}"
          ROOT="${CLAW_DEPLOY_ROOT}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          if git remote get-url gitea >/dev/null 2>&1; then
            git fetch --force gitea
          else
            git fetch --force origin
          fi
          git checkout -f "${FULL_SHA}"
          git log -1 --oneline
          test -f deploy/stack/lib/home-neurogate-deploy-from-tag.sh
          chmod +x deploy/stack/lib/home-neurogate-deploy-from-tag.sh
          # Jenkins (hook / claw-code-nora GIT_REF) must publish :sha-XXXXXXXXXXXX first. Author: kejiqing
          export CLAW_NORA_IMAGE_WAIT_SECS="${CLAW_NORA_IMAGE_WAIT_SECS:-3600}"
          export CLAW_NORA_IMAGE_POLL_SECS="${CLAW_NORA_IMAGE_POLL_SECS:-30}"
          echo "==> branch fast-up commit=${FULL_SHA} image_tag=${TAG}"
          bash deploy/stack/lib/home-neurogate-deploy-from-tag.sh "${TAG}"
